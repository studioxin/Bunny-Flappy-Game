  html, body {
    margin: 0; padding: 6px 0; min-height: 100vh; box-sizing: border-box;
    background: #CAD8AB;
    display: flex; align-items: center; justify-content: center;
    font-family: 'BunnierFont', 'Courier New', monospace;
  }
  #wrap { text-align: center; margin: 4px 0; }
  canvas {
    background: #FFFFFF;
    border: 3px solid #3D223D;
    image-rendering: pixelated;
    touch-action: none;
  }
  #msg {
    font-size: 20px;
    color: #3D223D;
    margin-top: 4px;
    letter-spacing: 0.5px;
    font-family: 'BunnierFont', 'Courier New', monospace;
  }

  html, body { margin: 0; min-height: 100%; }
  body { overflow-x: hidden; padding: 58px 8px 12px; box-sizing: border-box; }
  #wrap { width: 100%; box-sizing: border-box; }
  canvas {
    display: block;
    width: min(100%, 520px);
    height: auto;
    margin: 0 auto;
    box-sizing: border-box;
  }
  #backToStudio {
    position: fixed;
    top: max(10px, env(safe-area-inset-top));
    left: max(10px, env(safe-area-inset-left));
    z-index: 30;
    min-height: 44px;
    padding: 9px 14px;
    box-sizing: border-box;
    border: 3px solid #3D223D;
    border-radius: 8px;
    background: #FFFEE1;
    color: #3D223D;
    text-decoration: none;
    font: 18px 'BunnierFont', 'Courier New', monospace;
    line-height: 20px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    touch-action: manipulation;
  }
  body.game-active #backToStudio { display: none !important; }

// Ordered to match physical keyboard layout left-to-right: W (upper-left),
// SPACE (center), L (right-side letters), UP ARROW (far right arrow cluster)
const PLAYER_DEFS = [
  { key: 'KeyW',    label: 'W',     hue: 100 },
  { key: 'Space',   label: 'SPACE', hue: 0 },
  { key: 'KeyL',    label: 'L',     hue: 320 },
  { key: 'ArrowUp', label: 'UP',    hue: 210 }
];

function makePlayer(x, def) {
  return { x, y: H / 2, vy: 0, key: def.key, label: def.label, hue: def.hue, alive: true, score: 0, shieldCount: 0, invulnTimer: 0, doubleScoreTimer: 0 };
}

let numPlayers = null; // null = still choosing on the ready screen
let players = [];
let hiScore = 0; // only shown/used in single-player mode

function setupPlayers(count) {
  numPlayers = count;
  resizeCanvasForPlayers(count);
  const lanes = [];
  if (count === 1) {
    lanes.push(W * 0.28);
    // solo play always uses Space, no matter how multiplayer keys are ordered
    players = [makePlayer(lanes[0], { key: 'Space', label: 'SPACE', hue: 0 })];
    return;
  }
  const startX = 55;       // player 1's position, near the left
  const laneGap = 46;      // small fixed gap between neighboring bunnies
  for (let i = 0; i < count; i++) {
    lanes.push(startX + i * laneGap);
  }
  players = lanes.map((x, i) => makePlayer(x, PLAYER_DEFS[i]));
}

let pipes = [];
let hazards = [];   // star hazards, lethal
let shieldPickups = [];

function randRange(a, b) { return a + Math.random() * (b - a); }

function difficultyScore() {
  return players.length ? Math.max(...players.map(p => p.score)) : 0;
}
const MOVING_GATE_SCORE = 20; // no moving pipes/obstacles until this score is reached
const GAP_SHRINK_CAP_SCORE = 30; // gaps stop shrinking further past this score
function currentGapH() {
  const s = difficultyScore();
  if (s < 30) return GAP_H_START;               // 240, generous start
  if (s < 40) return 240 - (s - 30) * 4.0;       // 240 -> 200
  if (s < 50) return 200 - (s - 40) * 4.0;       // 200 -> 160
  return GAP_H_MIN;                              // locked at 160
}

const ORCHID_GRID = [
  "...p...p...",
  "...p...p...",
  "....p.p....",
  "....pyp....",
  "...pypyp...",
  "..sspypss..",
  ".sspsgspss.",
  ".sps.g.sps.",
  ".ss..g..ss.",
  ".....g.....",
  ".....g..",
  ".....g..",
  ".....g..",
  "....ggg.",
];
function drawFlower(f) {
  if (f.collected) return;
  const bobY = Math.sin(f.bob + frame * 0.08) * 3;
  const colorMap = { s: '#D6BEE2', y: '#FFFEE1', p: '#3D223D', g: '#7A9242' };
  const cols = Math.max(...ORCHID_GRID.map(r => r.length));
  const px = f.w / cols;
  for (let row = 0; row < ORCHID_GRID.length; row++) {
    for (let col = 0; col < ORCHID_GRID[row].length; col++) {
      const c = ORCHID_GRID[row][col];
      if (c === '.') continue;
      ctx.fillStyle = colorMap[c];
      ctx.fillRect(f.x + col * px, f.y + bobY + row * px, px + 1, px + 1);
    }
  }
}

// Shield pickup — a simple bubble icon, drawn procedurally
function drawShieldPickup(s) {
  if (s.collectedBy.every(c => c)) return;
  const bobY = Math.sin(s.bob + frame * 0.07) * 3;
  const cx = s.x + s.w / 2, cy = s.y + s.h / 2 + bobY;
  ctx.save();
  ctx.globalAlpha = 0.85;
  ctx.fillStyle = '#D6BEE2';
  ctx.strokeStyle = '#3D223D';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(cx, cy, s.w / 2, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();
  ctx.fillStyle = '#FFFEE1';
  ctx.beginPath();
  ctx.arc(cx - s.w * 0.18, cy - s.w * 0.18, s.w * 0.16, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

// Shield bubble(s) drawn around a protected player — one ring per stacked charge, fixed size regardless of sprite pose
const SHIELD_AURA_RADIUS = 24;
function drawShieldAura(p, s) {
  if (p.shieldCount <= 0) return;
  ctx.save();
  ctx.globalAlpha = 0.5;
  ctx.strokeStyle = '#D6BEE2';
  ctx.lineWidth = 3;
  for (let i = 0; i < p.shieldCount; i++) {
    ctx.beginPath();
    ctx.arc(p.x + s.w / 2, p.y + s.h / 2, SHIELD_AURA_RADIUS + i * 6, 0, Math.PI * 2);
    ctx.stroke();
  }
  ctx.restore();
}

function drawStarHazard(hz) {
  const isNight = Math.sin(dayNightPhase) < 0;
  const img = isNight ? imgStarNight : imgStar;
  if (!img.naturalWidth) return;
  ctx.drawImage(img, hz.x, hz.y, hz.w, hz.h);
}

function resetGame(count) {
  frame = 0;
  pipes = [];
  hazards = [];
  shieldPickups = [];
  pipesSinceShield = 99;
  setupPlayers(count);
  // no initial flap yet — players hang in place while the countdown plays
  let x = W + 190;
  for (let i = 0; i < 6; i++) {
    pipes.push(makePipe(x));
    x += PIPE_SPACING;
  }
  state = 'countdown';
  updateMobileControls();
  countdownValue = 3;
  countdownTimer = COUNTDOWN_STEP_FRAMES;
  msgEl.textContent = 'get ready!';
}

function makePipe(x) {
  const margin = 60;
  const gapH = currentGapH();
  const gapCenter = randRange(margin + gapH / 2, H - margin - gapH / 2);
  const fw = 16, fh = 20;
  const movingAllowed = difficultyScore() >= MOVING_GATE_SCORE;
  const isMoving = movingAllowed && Math.random() < 0.28 + Math.min(0.25, (difficultyScore() - MOVING_GATE_SCORE) * 0.01);
  const moveSpeed = isMoving ? randRange(0.4, 0.9) * (Math.random() < 0.5 ? -1 : 1) : 0;

  // one independent flower per player, spread out a little so nobody blocks anyone else
  const n = Math.max(1, players.length);
  const spacing = 18;
  const flowers = [];
  for (let i = 0; i < n; i++) {
    const offset = (i - (n - 1) / 2) * spacing;
    flowers.push({
      x: x + PIPE_W / 2 - fw / 2 + offset,
      y: gapCenter - fh / 2,
      w: fw, h: fh,
      bob: Math.random() * Math.PI * 2,
      collected: false
    });
  }

  const gapTop = gapCenter - gapH / 2;
  const gapBottom = gapCenter + gapH / 2;

  // rare second gap — an extra opening carved into the lower pipe segment,
  // more likely to appear early on (when gaps are already generous)
  const bottomSpace = H - gapBottom - CAP_H;
  const isStartPhase = difficultyScore() < MOVING_GATE_SCORE;
  const doubleGapChance = isStartPhase ? 0.05 : 0.02;
  let gap2 = null;
  let bonusFlowers = null;
  if (!isMoving && bottomSpace > 225 && Math.random() < doubleGapChance) {
    const g2h = 150;
    const g2Center = randRange(gapBottom + CAP_H + g2h / 2 + 30, H - g2h / 2 - 30);
    gap2 = { top: g2Center - g2h / 2, bottom: g2Center + g2h / 2 };

    // a bonus orchid sits in the second gap — one independent copy per player, like the regular flowers
    const bfw = 16, bfh = 20;
    bonusFlowers = [];
    for (let i = 0; i < n; i++) {
      const offset = (i - (n - 1) / 2) * spacing;
      bonusFlowers.push({
        x: x + PIPE_W / 2 - bfw / 2 + offset,
        y: g2Center - bfh / 2,
        w: bfw, h: bfh,
        bob: Math.random() * Math.PI * 2,
        collected: false
      });
    }
  }

  return {
    x,
    gapCenter,
    gapH,
    gapTop,
    gapBottom,
    gap2,
    bonusFlowers,
    moving: isMoving,
    moveSpeed,
    moveRangeTop: Math.max(margin + gapH / 2, gapCenter - 70),
    moveRangeBottom: Math.min(H - margin - gapH / 2, gapCenter + 70),
    flowers
  };
}

const SPIKE_GATE_SCORE = 50; // no star hazards ("spikes") until this score
let pipesSinceShield = 99; // large so the very first hazard still requires a shield first

function maybeSpawnShield(x) {
  if (Math.random() < 0.05) {
    const w = 22, h = 22;
    shieldPickups.push({
      x: x + PIPE_SPACING / 2 + randRange(-20, 20),
      y: randRange(90, H - 140),
      w, h,
      bob: Math.random() * Math.PI * 2,
      collectedBy: new Array(players.length).fill(false) // each player can grab their own charge from this same bubble
    });
    pipesSinceShield = 0;
    return true;
  }
  return false;
}

function maybeSpawnHazard(x) {
  pipesSinceShield++;
  if (difficultyScore() < SPIKE_GATE_SCORE) return;
  if (Math.random() < 0.22) {
    // a shield must have appeared within the last 1-2 pipes, or we spawn one now instead
    if (pipesSinceShield > 2) {
      maybeSpawnShield(x);
      return;
    }
    const w = 34, h = 46;
    hazards.push({
      x: x + PIPE_SPACING / 2,
      y: randRange(70, H - 120),
      w, h
    });
  }
}

function flap(player) {
  if (state !== 'running' || !player || !player.alive) return;
  player.vy = FLAP_V;
}

function drawMoveArrow(cx, cy, pointingUp) {
  ctx.save();
  ctx.fillStyle = '#7A9242';
  ctx.strokeStyle = '#3D223D';
  ctx.lineWidth = 1;
  const s = 6;
  ctx.beginPath();
  if (pointingUp) {
    ctx.moveTo(cx, cy - s);
    ctx.lineTo(cx - s, cy + s * 0.6);
    ctx.lineTo(cx + s, cy + s * 0.6);
  } else {
    ctx.moveTo(cx, cy + s);
    ctx.lineTo(cx - s, cy - s * 0.6);
    ctx.lineTo(cx + s, cy - s * 0.6);
  }
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
  ctx.restore();
}

function drawPipe(p) {
  ctx.fillStyle = '#D6BEE2';
  ctx.strokeStyle = '#3D223D';
  ctx.lineWidth = 2;

  ctx.fillRect(p.x, 0, PIPE_W, p.gapTop - CAP_H);
  ctx.strokeRect(p.x, 0, PIPE_W, p.gapTop - CAP_H);

  if (p.gap2) {
    // bottom segment is split by the extra gap
    ctx.fillRect(p.x, p.gapBottom + CAP_H, PIPE_W, p.gap2.top - CAP_H - (p.gapBottom + CAP_H));
    ctx.strokeRect(p.x, p.gapBottom + CAP_H, PIPE_W, p.gap2.top - CAP_H - (p.gapBottom + CAP_H));
    ctx.fillRect(p.x, p.gap2.bottom + CAP_H, PIPE_W, H - p.gap2.bottom - CAP_H);
    ctx.strokeRect(p.x, p.gap2.bottom + CAP_H, PIPE_W, H - p.gap2.bottom - CAP_H);

    const capX2 = p.x - CAP_OVERHANG;
    const capW2 = PIPE_W + CAP_OVERHANG * 2;
    ctx.fillStyle = '#7A9242'; // brand green marks the bonus second gap
    ctx.fillRect(capX2, p.gap2.top - CAP_H, capW2, CAP_H);
    ctx.strokeRect(capX2, p.gap2.top - CAP_H, capW2, CAP_H);
    ctx.fillRect(capX2, p.gap2.bottom, capW2, CAP_H);
    ctx.strokeRect(capX2, p.gap2.bottom, capW2, CAP_H);
    ctx.fillStyle = '#D6BEE2';
  } else {
    ctx.fillRect(p.x, p.gapBottom + CAP_H, PIPE_W, H - p.gapBottom - CAP_H);
    ctx.strokeRect(p.x, p.gapBottom + CAP_H, PIPE_W, H - p.gapBottom - CAP_H);
  }

  const capX = p.x - CAP_OVERHANG;
  const capW = PIPE_W + CAP_OVERHANG * 2;
  ctx.fillStyle = p.moving ? '#FFFEE1' : '#D6BEE2'; // clearly different color for moving pipes
  ctx.fillRect(capX, p.gapTop - CAP_H, capW, CAP_H);
  ctx.strokeRect(capX, p.gapTop - CAP_H, capW, CAP_H);
  ctx.fillRect(capX, p.gapBottom, capW, CAP_H);
  ctx.strokeRect(capX, p.gapBottom, capW, CAP_H);

  if (p.moving) {
    const cx = p.x + PIPE_W / 2;
    const goingUp = p.moveSpeed < 0;
    drawMoveArrow(cx, p.gapTop - CAP_H / 2, goingUp);
    drawMoveArrow(cx, p.gapBottom + CAP_H / 2, goingUp);
  }
}

// Each player gets their own fixed color, matching the color their score is drawn in.
// Player 1 stays the default white/black sprite (paired with the normal adaptive text color);
// players 2-4 get distinct pastel tints.
const PLAYER_COLORS = ['#CAD8AB', '#FFFFFF', '#D6BEE2', '#FFFEE1'];

const tintedSpriteCache = {};
function getTintedSprite(img, colorIndex) {
  if (colorIndex == null || !PLAYER_COLORS[colorIndex] || !img.naturalWidth) return img;
  const key = (img === imgBunny ? 'n' : 'j') + colorIndex;
  if (tintedSpriteCache[key]) return tintedSpriteCache[key];

  const w = img.naturalWidth, h = img.naturalHeight;
  const off = document.createElement('canvas');
  off.width = w; off.height = h;
  const octx = off.getContext('2d');
  // recolor only the white fill (keeps the black outline black) via multiply, then
  // clip back to the original silhouette so transparent areas stay transparent
  octx.drawImage(img, 0, 0);
  octx.globalCompositeOperation = 'multiply';
  octx.fillStyle = PLAYER_COLORS[colorIndex];
  octx.fillRect(0, 0, w, h);
  octx.globalCompositeOperation = 'destination-in';
  octx.drawImage(img, 0, 0);
  octx.globalCompositeOperation = 'source-over';

  tintedSpriteCache[key] = off;
  return off;
}

function drawBunny(p, colorIndex) {
  const baseImg = p.vy < -1 ? imgBunnyJump : imgBunny;
  const s = bunnySize(baseImg);
  if (!s.w || !s.h) return;
  const img = getTintedSprite(baseImg, colorIndex);
  drawShieldAura(p, s);
  const angle = Math.max(-0.35, Math.min(0.9, p.vy / 12));
  ctx.save();
  if (!p.alive) ctx.globalAlpha = 0.25;
  ctx.translate(p.x + s.w / 2, p.y + s.h / 2);
  ctx.rotate(angle);
  ctx.drawImage(img, -s.w / 2, -s.h / 2, s.w, s.h);
  ctx.restore();
}

function drawSky() {
  const raw = Math.sin(dayNightPhase);
  const fadeWidth = 0.02;
  const t = Math.max(-1, Math.min(1, raw / fadeWidth));
  const whiteAmount = (t + 1) / 2;
  const v = Math.round(whiteAmount * 255);
  ctx.fillStyle = `rgb(${v},${v},${v})`;
  ctx.fillRect(0, 0, W, H);
}

function collideRect(ax, ay, aw, ah, bx, by, bw, bh) {
  return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
}

function killPlayer(p) {
  if (p.invulnTimer > 0) return; // brief grace window right after a shield hit
  if (p.shieldCount > 0) {
    const hadDouble = p.shieldCount >= 2;
    p.shieldCount--;
    // with two shields stacked, the invulnerability window is long enough to fly clean through a wall
    p.invulnTimer = hadDouble ? 70 : 26;
    return;
  }
  p.alive = false;
  if (p.score > hiScore) hiScore = p.score;
  if (players.every(pl => !pl.alive)) {
    state = 'over';
    msgEl.textContent = 'game over — press 1-4 or tap a player button to play again';
    updateMobileControls();
  }
}

function update(dtFactor) {
  frame++;
  dayNightPhase += (2 * Math.PI) / dayNightPeriod * dtFactor;

  const pipeMove = PIPE_SPEED * dtFactor;
  for (const p of pipes) {
    p.x -= pipeMove;
    for (const fl of p.flowers) fl.x -= pipeMove;
    if (p.bonusFlowers) for (const bf of p.bonusFlowers) bf.x -= pipeMove;
    if (p.moving) {
      p.gapCenter += p.moveSpeed * dtFactor;
      if (p.gapCenter < p.moveRangeTop || p.gapCenter > p.moveRangeBottom) p.moveSpeed *= -1;
      p.gapTop = p.gapCenter - p.gapH / 2;
      p.gapBottom = p.gapCenter + p.gapH / 2;
      for (const fl of p.flowers) fl.y = p.gapCenter - fl.h / 2;
    }
  }
  for (const hz of hazards) hz.x -= pipeMove;
  for (const sp of shieldPickups) sp.x -= pipeMove;

  for (let pi = 0; pi < players.length; pi++) {
    const player = players[pi];
    if (!player.alive) continue;

    if (player.invulnTimer > 0) player.invulnTimer -= dtFactor;
    if (player.doubleScoreTimer > 0) player.doubleScoreTimer -= dtFactor;
    player.vy += GRAVITY * dtFactor;
    player.vy = Math.min(player.vy, MAX_FALL);
    player.y += player.vy * dtFactor;
    if (player.y < 0) { player.y = 0; player.vy = 0; }

    const s = bunnySize(imgBunny);
    const bw = s.w * 0.75, bh = s.h * 0.75;
    const bx = player.x + s.w * 0.12, by = player.y + s.h * 0.12;

    if (player.y + s.h >= H) {
      killPlayer(player);
      continue;
    }

    for (const p of pipes) {
      const myFlower = p.flowers[pi]; // each player has their own — nobody can block anyone else
      const touchedFlower = myFlower && !myFlower.collected &&
                             bx + bw > myFlower.x && bx < myFlower.x + myFlower.w &&
                             by + bh > myFlower.y && by < myFlower.y + myFlower.h;
      if (touchedFlower) {
        myFlower.collected = true;
        player.score += player.doubleScoreTimer > 0 ? 2 : 1;
      }

      const myBonus = p.bonusFlowers && p.bonusFlowers[pi];
      if (myBonus && !myBonus.collected &&
          bx + bw > myBonus.x && bx < myBonus.x + myBonus.w &&
          by + bh > myBonus.y && by < myBonus.y + myBonus.h) {
        myBonus.collected = true;
        player.score += player.doubleScoreTimer > 0 ? 2 : 1;
        player.doubleScoreTimer = DOUBLE_SCORE_DURATION;
      }

      const capX = p.x - CAP_OVERHANG;
      const capW = PIPE_W + CAP_OVERHANG * 2;
      const hitTop = collideRect(bx, by, bw, bh, p.x, 0, PIPE_W, p.gapTop - CAP_H) ||
                     collideRect(bx, by, bw, bh, capX, p.gapTop - CAP_H, capW, CAP_H);
      let hitBottom;
      if (p.gap2) {
        hitBottom = collideRect(bx, by, bw, bh, p.x, p.gapBottom + CAP_H, PIPE_W, p.gap2.top - CAP_H - (p.gapBottom + CAP_H)) ||
                    collideRect(bx, by, bw, bh, p.x, p.gap2.bottom + CAP_H, PIPE_W, H - p.gap2.bottom - CAP_H) ||
                    collideRect(bx, by, bw, bh, capX, p.gapBottom, capW, CAP_H) ||
                    collideRect(bx, by, bw, bh, capX, p.gap2.top - CAP_H, capW, CAP_H) ||
                    collideRect(bx, by, bw, bh, capX, p.gap2.bottom, capW, CAP_H);
      } else {
        hitBottom = collideRect(bx, by, bw, bh, p.x, p.gapBottom + CAP_H, PIPE_W, H - p.gapBottom - CAP_H) ||
                    collideRect(bx, by, bw, bh, capX, p.gapBottom, capW, CAP_H);
      }
      if (hitTop || hitBottom) killPlayer(player);
    }

    for (const hz of hazards) {
      if (bx + bw * 0.8 > hz.x && bx < hz.x + hz.w * 0.8 &&
          by + bh * 0.8 > hz.y && by < hz.y + hz.h * 0.8) {
        killPlayer(player);
      }
    }

    for (const sp of shieldPickups) {
      if (sp.collectedBy[pi]) continue; // this player already took their charge from this exact bubble
      if (bx + bw > sp.x && bx < sp.x + sp.w && by + bh > sp.y && by < sp.y + sp.h) {
        sp.collectedBy[pi] = true;
        player.shieldCount = Math.min(2, player.shieldCount + 1);
      }
    }
  }

  for (const pl of players) if (pl.score > hiScore) hiScore = pl.score;

  pipes = pipes.filter(p => p.x > -PIPE_W - 20);
  hazards = hazards.filter(hz => hz.x > -60);
  shieldPickups = shieldPickups.filter(sp => sp.x > -40 && !sp.collectedBy.every(c => c));

  const rightmostPipe = pipes.length ? Math.max(...pipes.map(p => p.x)) : W;
  if (pipes.length < 6) {
    const newX = rightmostPipe + PIPE_SPACING;
    pipes.push(makePipe(newX));
    maybeSpawnHazard(newX);
    maybeSpawnShield(newX);
  }
}

function drawKeyBadge(label, x, align) {
  ctx.font = '18px BunnierFont, monospace';
  const padX = 10, padY = 6;
  const textW = ctx.measureText(label).width;
  const boxW = textW + padX * 2, boxH = 30;
  let boxX = x;
  if (align === 'right') boxX = x - boxW;
  if (align === 'center') boxX = x - boxW / 2;
  const boxY = 8;
  ctx.save();
  ctx.fillStyle = '#FFFEE1';
  ctx.strokeStyle = '#3D223D';
  ctx.lineWidth = 2;
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(boxX, boxY, boxW, boxH, 7); else ctx.rect(boxX, boxY, boxW, boxH);
  ctx.fill();
  ctx.stroke();
  ctx.fillStyle = '#000000';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(label, boxX + boxW / 2, boxY + boxH / 2 + 1);
  ctx.textBaseline = 'alphabetic';
  ctx.restore();
  ctx.textAlign = 'left';
}

function textColorFor(colorIndex) {
  const adaptiveColor = Math.sin(dayNightPhase) < 0 ? '#FFFEE1' : '#3D223D';
  if (colorIndex == null) return adaptiveColor;
  const c = PLAYER_COLORS[colorIndex];
  return c || adaptiveColor;
}

// Fills text in its true color; if that color would vanish against the background,
// adds a thin black outline first so it stays readable without changing the color.
function fillScoreText(text, x, y, color) {
  ctx.strokeStyle = '#000000';
  ctx.lineWidth = 3.5;
  ctx.strokeText(text, x, y);
  ctx.fillStyle = color;
  ctx.fillText(text, x, y);
}

function drawScoreFor(p, x, align, colorIndex) {
  const textColor = textColorFor(colorIndex);
  drawKeyBadge(p.label, x, align);
  ctx.font = '56px BunnierFont, monospace';
  ctx.textAlign = align;
  fillScoreText(String(p.score), x, 78, textColor);
  if (p.doubleScoreTimer > 0) {
    ctx.fillStyle = '#D6499A';
    ctx.font = '20px BunnierFont, monospace';
    ctx.fillText('2x!', x, 100);
  }
}

function drawScoreRow() {
  const n = players.length;
  const textColor = Math.sin(dayNightPhase) < 0 ? '#FFFEE1' : '#3D223D';

  if (n === 1) {
    // key badge, then high score and current score sit right next to each other, both on the right
    drawKeyBadge(players[0].label, W - 16, 'right');
    ctx.fillStyle = textColor;
    ctx.font = '56px BunnierFont, monospace';
    const scoreStr = String(players[0].score);
    const hiStr = String(hiScore);
    const spacer = '   ';
    const spacerW = ctx.measureText(spacer).width;
    const hiW = ctx.measureText(hiStr).width;
    const scoreW = ctx.measureText(scoreStr).width;
    let x = W - 16 - (hiW + spacerW + scoreW);
    const y = 78;
    ctx.textAlign = 'left';
    ctx.fillStyle = textColor;
    ctx.fillText(hiStr, x, y); x += hiW;
    ctx.fillText(spacer, x, y); x += spacerW;
    fillScoreText(scoreStr, x, y, '#FFFFFF');
    if (players[0].doubleScoreTimer > 0) {
      ctx.fillStyle = '#D6499A';
      ctx.font = '20px BunnierFont, monospace';
      ctx.textAlign = 'right';
      ctx.fillText('2x!', W - 16, 100);
    }
    ctx.textAlign = 'left';
    return;
  }

  // spread each player's score across the top, evenly, so it works for 2-4 players
  players.forEach((p, i) => {
    const align = i === 0 ? 'left' : i === n - 1 ? 'right' : 'center';
    let x = 16 + (i * (W - 32) / (n - 1));
    if (align === 'right') x = W - 16;
    drawScoreFor(p, x, align, i);
  });

  // the single-player all-time best always stays visible, even mid-multiplayer,
  // so it's clear the record is preserved and not lost when switching modes
  if (hiScore > 0) {
    ctx.fillStyle = textColor;
    ctx.textAlign = 'center';
    ctx.font = '24px BunnierFont, monospace';
    ctx.fillText('best: ' + hiScore, W / 2, 118);
    ctx.textAlign = 'left';
  }
}

function render() {
  ctx.clearRect(0, 0, W, H);
  drawSky();
  for (const p of pipes) {
    drawPipe(p);
    for (const fl of p.flowers) drawFlower(fl);
    if (p.bonusFlowers) for (const bf of p.bonusFlowers) drawFlower(bf);
  }
  for (const sp of shieldPickups) drawShieldPickup(sp);
  for (const hz of hazards) drawStarHazard(hz);
  players.forEach((p, i) => drawBunny(p, players.length === 1 ? null : i));

  if (state === 'running' || state === 'over' || state === 'countdown') drawScoreRow();

  const textColor = Math.sin(dayNightPhase) < 0 ? '#FFFEE1' : '#3D223D';
  ctx.fillStyle = textColor;
  if (state === 'countdown') {
    ctx.font = '90px BunnierFont, monospace';
    ctx.textAlign = 'center';
    ctx.fillText(String(countdownValue), W / 2, H / 2 + 30);
    ctx.textAlign = 'left';
  }
  ctx.textAlign = 'center';

  if (state === 'ready') {
    const logoSize = 55;
    if (imgLogo.naturalWidth) {
      const lw = logoSize, lh = logoSize * (imgLogo.naturalHeight / imgLogo.naturalWidth);
      const textTopY = H / 2 - 50 - 28; // roughly where "how many players?" text starts
      const logoCenterY = textTopY / 2; // centered between the top of the box (y=0) and the text
      // alternates between two still frames (-5deg / +5deg), no smooth easing in between
      const tiltRight = Math.floor(menuFrame / 40) % 2 === 0;
      const angle = (tiltRight ? 5 : -5) * Math.PI / 180;
      ctx.save();
      ctx.translate(W / 2, logoCenterY);
      ctx.rotate(angle);
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(imgLogo, -lw / 2, -lh / 2, lw, lh);
      ctx.imageSmoothingEnabled = false;
      ctx.restore();
    }
    ctx.font = '28px BunnierFont, monospace';
    ctx.fillText('how many players?', W / 2, H / 2 - 50);
    ctx.font = '38px BunnierFont, monospace';
    ctx.fillText('1   2   3   4', W / 2, H / 2);
    ctx.font = '20px BunnierFont, monospace';
    ctx.fillText('press a number key or tap below', W / 2, H / 2 + 38);
  }

  if (state === 'over') {
    ctx.fillStyle = 'rgba(255,254,225,0.82)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = textColor;
    ctx.font = '38px BunnierFont, monospace';
    ctx.fillText('GAME OVER', W / 2, H / 2 - 34);
    ctx.font = '24px BunnierFont, monospace';
    let message;
    if (players.length === 1) {
      message = 'score ' + players[0].score;
    } else {
      const top = Math.max(...players.map(p => p.score));
      const winners = players.filter(p => p.score === top);
      message = winners.length > 1 ? "it's a tie!" : ('player ' + (players.indexOf(winners[0]) + 1) + ' wins!');
    }
    ctx.fillText(message, W / 2, H / 2 + 4);
    ctx.font = '18px BunnierFont, monospace';
    ctx.fillText('press 1-4 or tap below', W / 2, H / 2 + 34);
  }
  ctx.textAlign = 'left';
}

let lastTimestamp = null;
function loop(timestamp) {
  if (lastTimestamp === null) lastTimestamp = timestamp;
  const dt = timestamp - lastTimestamp;
  lastTimestamp = timestamp;
  // clamp so a paused/backgrounded tab doesn't cause one huge catch-up jump
  const dtFactor = Math.max(0.2, Math.min(3, dt / (1000 / 60)));

  menuFrame += dtFactor; // keeps animating even on the ready/menu screen

  if (state === 'countdown') {
    countdownTimer -= dtFactor;
    if (countdownTimer <= 0) {
      countdownValue--;
      countdownTimer = COUNTDOWN_STEP_FRAMES;
      if (countdownValue <= 0) {
        state = 'running'; // no initial flap — players start neutral
        msgEl.textContent = 'collect orchids for points!';
      }
    }
  } else if (state === 'running') {
    update(dtFactor);
  }
  render();
  requestAnimationFrame(loop);
}

canvas.tabIndex = 0;

function keyToPlayer(code) {
  return players.find(p => p.key === code) || null;
}

window.addEventListener('keydown', (e) => {
  const flapKeys = ['Space', 'ArrowUp', 'KeyW', 'KeyL'];
  const numberKeys = ['Digit1', 'Digit2', 'Digit3', 'Digit4'];

  if (flapKeys.includes(e.code)) e.preventDefault();

  if (numberKeys.includes(e.code) && (state === 'ready' || state === 'over')) {
    e.preventDefault();
    const count = numberKeys.indexOf(e.code) + 1;
    resetGame(count);
    return;
  }

  if (flapKeys.includes(e.code) && state === 'running') {
    flap(keyToPlayer(e.code));
  }
});

function pickNumberFromX(canvasX) {
  ctx.font = '38px BunnierFont, monospace';
  const fullStr = '1   2   3   4';
  const fullW = ctx.measureText(fullStr).width;
  const startX = W / 2 - fullW / 2;
  const segment = Math.floor((canvasX - startX) / (fullW / 4));
  return Math.max(1, Math.min(4, segment + 1));
}

function toCanvasCoords(clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  const scaleX = W / rect.width;
  const scaleY = H / rect.height;
  return { x: (clientX - rect.left) * scaleX, y: (clientY - rect.top) * scaleY };
}

canvas.addEventListener('mousedown', (e) => {
  e.preventDefault();
  canvas.focus();
  if (state === 'ready' || state === 'over') {
    const { x } = toCanvasCoords(e.clientX, e.clientY);
    resetGame(pickNumberFromX(x));
    return;
  }
  if (state === 'running') flap(players[0]);
});

function updateMobileControls() {
  const choosing = state === 'ready' || state === 'over';
  const activelyPlaying = state === 'countdown' || state === 'running';
  const mobileUI = window.matchMedia('(max-width: 700px), (pointer: coarse)').matches;

  document.body.classList.toggle('game-active', mobileUI && activelyPlaying);
  document.body.classList.toggle('players-3-4', mobileUI && activelyPlaying && players.length >= 3);

  // Back to Studio Xin stays permanently visible on desktop. On mobile it hides only during active play to make room for P4.
  backToStudio.style.display = (!mobileUI || !activelyPlaying) ? 'inline-flex' : 'none';
  playerPicker.style.display = mobileUI ? 'flex' : 'none';
  playerPicker.style.visibility = mobileUI && choosing ? 'visible' : 'hidden';
  touchCorners.forEach((zone, i) => {
    zone.classList.toggle('active', mobileUI && !choosing && i < players.length);
  });
}

function choosePlayersFromButton(e) {
  const target = e.target && e.target.closest ? e.target.closest('button[data-players]') : null;
  if (!target || !(state === 'ready' || state === 'over')) return;
  if (e.cancelable) e.preventDefault();
  resetGame(Number(target.dataset.players));
}
playerPicker.addEventListener('click', choosePlayersFromButton);

// On phones/tablets each player owns a different OUTSIDE corner of the screen.
// P1 bottom-left, P2 bottom-right, P3 top-right, P4 top-left (below the Back button).
// Pointer Events allow multiple players to tap at the same time.
// Prevent iPhone/iPad Safari from zooming on rapid double-taps while playing.
let lastTouchEnd = 0;
document.addEventListener('touchend', (e) => {
  const now = Date.now();
  if (now - lastTouchEnd <= 300 && (state === 'countdown' || state === 'running')) {
    if (e.cancelable) e.preventDefault();
  }
  lastTouchEnd = now;
}, { passive: false });

touchCorners.forEach((zone, index) => {
  zone.textContent = 'P' + (index + 1);
  zone.setAttribute('role', 'button');
  zone.setAttribute('aria-label', 'Player ' + (index + 1) + ' flap');
  zone.addEventListener('pointerdown', (e) => {
    if (state !== 'running' || index >= players.length) return;
    e.preventDefault();
    try { zone.setPointerCapture(e.pointerId); } catch (_) {}
    flap(players[index]);
  }, { passive: false });
});

// Keep touch inside the canvas from accidentally controlling a player on phone.
canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
}, { passive: false });

updateMobileControls();
render();
requestAnimationFrame(loop);

// Re-render after the custom font becomes available, but never block the game on font loading.
if (document.fonts && document.fonts.load) {
  Promise.all([
    document.fonts.load('16px BunnierFont'),
    document.fonts.load('18px BunnierFont')
  ]).then(render).catch(() => {});
}
</script>

<script>
  // Extra iOS Safari protection against page scrolling/rubber-band movement.
  document.addEventListener('touchmove', function (event) {
    if (window.matchMedia('(max-width: 700px), (pointer: coarse)').matches) {
      event.preventDefault();
    }
  }, { passive: false });
</script>

<script>
(function () {
  function isMobileUI() {
    return window.matchMedia('(max-width: 700px), (pointer: coarse)').matches;
  }

  function fitMultiplayerGame() {
    if (!isMobileUI() || !document.body.classList.contains('game-active') || !document.body.classList.contains('players-3-4')) {
      wrap.style.removeProperty('top');
      wrap.style.removeProperty('bottom');
      wrap.style.removeProperty('height');
      canvas.style.removeProperty('width');
      canvas.style.removeProperty('height');
      return;
    }

    const viewW = window.visualViewport ? window.visualViewport.width : window.innerWidth;
    const viewH = window.visualViewport ? window.visualViewport.height : window.innerHeight;
    const topZones = [touchCorners[2], touchCorners[3]].filter(z => z.classList.contains('active'));
    const bottomZones = [touchCorners[0], touchCorners[1]].filter(z => z.classList.contains('active'));
    const topEdge = topZones.length ? Math.max(...topZones.map(z => z.getBoundingClientRect().bottom)) : 0;
    const bottomEdge = bottomZones.length ? Math.min(...bottomZones.map(z => z.getBoundingClientRect().top)) : viewH;
    const gap = 10;
    const freeTop = topEdge + gap;
    const freeBottom = bottomEdge - gap;
    const freeH = Math.max(80, freeBottom - freeTop);

    // IMPORTANT: centre ONLY THE CANVAS between the player buttons.
    // The instruction/status text below the canvas is deliberately NOT included
    // when calculating the vertical centre.
    const canvasWAvailable = Math.max(60, viewW - 16);
    const canvasHAvailable = Math.max(60, freeH);
    const scale = Math.min(canvasWAvailable / canvas.width, canvasHAvailable / canvas.height, 1);
    const cssW = Math.floor(canvas.width * scale);
    const cssH = Math.floor(canvas.height * scale);
    const canvasTop = Math.round(freeTop + (freeH - cssH) / 2);

    // Position the wrap from the canvas itself. The message can flow below it
    // without pulling the game window upward.
    wrap.style.top = canvasTop + 'px';
    wrap.style.bottom = 'auto';
    wrap.style.height = 'auto';
    wrap.style.justifyContent = 'flex-start';
    canvas.style.width = cssW + 'px';
    canvas.style.height = cssH + 'px';
  }

  const originalUpdateMobileControls = updateMobileControls;
  updateMobileControls = function () {
    originalUpdateMobileControls();
    requestAnimationFrame(fitMultiplayerGame);
  };

  window.addEventListener('resize', fitMultiplayerGame);
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', fitMultiplayerGame);
    window.visualViewport.addEventListener('scroll', fitMultiplayerGame);
  }

  ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (type) {
    document.addEventListener(type, function (e) {
      if (isMobileUI() && e.cancelable) e.preventDefault();
    }, { passive: false });
  });

  let lastMobileTouchEnd = 0;
  document.addEventListener('touchend', function (e) {
    if (!isMobileUI()) return;
    const now = Date.now();
    if (now - lastMobileTouchEnd < 350 && e.cancelable) e.preventDefault();
    lastMobileTouchEnd = now;
  }, { passive: false, capture: true });

  document.documentElement.style.webkitTextSizeAdjust = '100%';
  fitMultiplayerGame();
})();
</script>
</body>
